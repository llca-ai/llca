[package]
name = "llca"
version = "0.7.6"
authors = ["Yassine Bouayyad"]
edition = "2021"
description = "Local Ledger for Coding Agents: a local, private log of what Codex and Claude Code do on your machine"
license = "MIT"
repository = "https://github.com/llca-ai/llca"
homepage = "https://github.com/llca-ai/llca"
readme = "README.md"
rust-version = "1.89"

# No third-party crates on purpose: the collector runs on every agent action,
# so everything it executes should be auditable in this repository. SQLite is
# the system library (libsqlite3), linked dynamically.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
