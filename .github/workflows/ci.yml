# Checks every push and pull request on macOS and Linux: formatting, lints,
# and the whole test suite (including every case of rules/cases.txt).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: SQLite development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

  # The oldest Rust the project supports (rust-version in Cargo.toml).
  msrv:
    name: Rust 1.89 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 build --release --locked
