<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How llca works</title>
<desc id="d">Codex and Claude Code call the llca collector through a hook on every tool call. The collector masks secrets and writes a minimal event to a SQLite journal on your computer. The dashboard on 127.0.0.1 reads the journal. The agents talk to their model provider; llca sends nothing over the network.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b3ac"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" rx="14" fill="#0e1412"/>
<rect x="40" y="22" width="250" height="58" rx="10" fill="#151d1a" stroke="#2f3c36" stroke-width="1.2"/>
<text x="58" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e4ece7" text-anchor="start">Model provider</text>
<text x="58" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3b3ac" text-anchor="start">OpenAI, Anthropic</text>
<text x="310" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3b3ac" text-anchor="start">The agent talks to its model,</text>
<text x="310" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3b3ac" text-anchor="start">as it always does. llca is not involved.</text>
<rect x="20" y="106" width="960" height="262" rx="14" fill="none" stroke="#a3b3ac" stroke-width="1.2" stroke-dasharray="6 6"/>
<rect x="36" y="96" width="122" height="20" fill="#0e1412"/>
<text x="44" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a3b3ac" text-anchor="start">Your computer</text>
<rect x="40" y="150" width="190" height="180" rx="10" fill="#151d1a" stroke="#2f3c36" stroke-width="1.2"/>
<text x="58" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3b3ac" text-anchor="start">Coding agents</text>
<rect x="56" y="194" width="158" height="44" rx="10" fill="#0e1412" stroke="#2f3c36" stroke-width="1.2"/>
<rect x="56" y="194" width="4" height="44" rx="2" fill="#e4ece7"/>
<text x="72" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e4ece7" text-anchor="start">Codex</text>
<rect x="56" y="252" width="158" height="44" rx="10" fill="#0e1412" stroke="#2f3c36" stroke-width="1.2"/>
<rect x="56" y="252" width="4" height="44" rx="2" fill="#de7a54"/>
<text x="72" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e4ece7" text-anchor="start">Claude Code</text>
<text x="58" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="start">every tool call</text>
<line x1="200" y1="150" x2="200" y2="84" stroke="#a3b3ac" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr)" marker-start="url(#arr)"/>
<line x1="232" y1="240" x2="280" y2="240" stroke="#a3b3ac" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="256" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="middle">hook</text>
<rect x="282" y="150" width="230" height="180" rx="10" fill="#1d3228" stroke="#2f5541" stroke-width="1.2"/>
<text x="300" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e4ece7" text-anchor="start">llca collector</text>
<text x="300" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="start">about 4 ms, never blocks</text>
<rect x="300" y="212" width="194" height="30" rx="10" fill="#151d1a" stroke="#2f3c36" stroke-width="1.2"/>
<text x="310" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e4ece7" text-anchor="start">TOKEN=<tspan fill="#ff6b81" font-weight="600">[REDACTED]</tspan></text>
<text x="300" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">• masks secrets first</text>
<text x="300" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">• keeps no output, no file</text>
<text x="312" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">contents, no prompts</text>
<line x1="514" y1="240" x2="562" y2="240" stroke="#a3b3ac" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="538" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="middle">writes</text>
<rect x="564" y="150" width="190" height="180" rx="10" fill="#151d1a" stroke="#2f3c36" stroke-width="1.2"/>
<ellipse cx="594" cy="170" rx="10" ry="4" fill="none" stroke="#8fd6ad" stroke-width="1.6"/>
<path d="M584 170 v14 a10 4 0 0 0 20 0 v-14" fill="none" stroke="#8fd6ad" stroke-width="1.6"/>
<text x="612" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e4ece7" text-anchor="start">Journal</text>
<text x="582" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">SQLite, in a folder</text>
<text x="582" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">only you can open</text>
<text x="582" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3b3ac" text-anchor="start">kept 90 days</text>
<text x="582" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="start">(llca retention)</text>
<line x1="756" y1="240" x2="804" y2="240" stroke="#a3b3ac" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="780" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="middle">reads</text>
<rect x="806" y="150" width="154" height="180" rx="10" fill="#151d1a" stroke="#2f3c36" stroke-width="1.2"/>
<text x="824" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e4ece7" text-anchor="start">Dashboard</text>
<text x="824" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#8fd6ad" text-anchor="start">127.0.0.1</text>
<text x="824" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">in your browser,</text>
<text x="824" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">plain words,</text>
<text x="824" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">secret alerts,</text>
<text x="824" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e4ece7" text-anchor="start">your rules</text>
<text x="824" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#a3b3ac" text-anchor="start">llca open</text>
<circle cx="46" cy="398" r="9" fill="none" stroke="#8fd6ad" stroke-width="1.6"/>
<path d="M41.5 398.5l3 3 6-6.5" fill="none" stroke="#8fd6ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e4ece7" text-anchor="start">No account, no server: llca itself never sends anything over the network.</text>
